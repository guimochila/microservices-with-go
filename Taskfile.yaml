# https://taskfile.dev
version: '3'

vars:
  BUILD_DIR: ./dist
  MODULE: 'github.com/guimochila/microservices-with-go'
  
includes:
  buf:
    taskfile: ./tools/taskfiles/Buf.yml
    aliases: [b]

tasks:
  clean:
    cmds:
      - rm -rf ./dist

  clean-gen:
    silent: true
    vars:
      FILES:
        sh: grep --include='*.go' -rl -i 'Code generated by' .
    cmds:
      - rm -rvf {{.FILES | splitList "\n" | join " "}}

  generate:
    aliases: [gen]
    deps:
      - task: buf:generate
    cmds:
      - go mod tidy

